name: Auto Assign Reviewer and Deploy

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewer (you)
        uses: kentaro-m/auto-assign-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          addAssignees: true
          addReviewers: true
          assignees: |
            Gautam-Ranpariya
          reviewers: |
            Gautam-Ranpariya

      - name: Auto-approve if PR author is repo owner
        if: ${{ github.event.pull_request.user.login == 'Gautam-Ranpariya' }}
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

      - name: Comment for admin review if PR author is not owner
        if: ${{ github.event.pull_request.user.login != 'Gautam-Ranpariya' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Auto-assigned and requested review from @Gautam-Ranpariya"
            })

  trigger-deploy:
    runs-on: ubuntu-latest
    needs: assign-reviewer
    if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'approved' }}

    steps:
      - name: Trigger Deploy Workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow: 'deploy.yml'
          ref: ${{ github.event.pull_request.head.ref }}
          inputs:
            deploy: true
