name: Auto Assign Reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      pr_author:
        description: 'Pull Request Author'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ github.event.inputs.pr_number }}')
            });

            core.setOutput('pr_state', pr.data.state);
            core.setOutput('pr_draft', pr.data.draft);
            core.setOutput('pr_author', pr.data.user.login);

      - name: Assign reviewer (you)
        if: steps.pr-details.outputs.pr_state == 'open' && steps.pr-details.outputs.pr_draft == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ github.event.inputs.pr_number }}'),
              reviewers: ['Gautam-Ranpariya']
            });

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.pr_number }}'),
              assignees: ['Gautam-Ranpariya']
            });

      - name: Auto-approve if PR author is repo owner
        if: github.event.inputs.pr_author == 'Gautam-Ranpariya'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ github.event.inputs.pr_number }}'),
              event: 'APPROVE',
              body: '✅ Auto-approved by repo owner'
            });

      - name: Comment for admin review if PR author is not owner
        if: github.event.inputs.pr_author != 'Gautam-Ranpariya'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: parseInt('${{ github.event.inputs.pr_number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Auto-assigned and requested review from @Gautam-Ranpariya after successful CI/CD checks"
            });
