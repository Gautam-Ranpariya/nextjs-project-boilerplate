name: Auto Assign Reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      pr_author:
        description: 'Pull Request Author'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write
  actions: read

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR details and assign reviewer dynamically
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
            const prAuthor = '${{ github.event.inputs.pr_author }}';

            console.log(`Processing PR #${prNumber} by ${prAuthor}`);

            try {
              // Get PR details
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              console.log(`PR State: ${pr.data.state}, Draft: ${pr.data.draft}`);

              if (pr.data.state === 'open' && !pr.data.draft) {
                // Reviewer logic
                let reviewer;
                if (prAuthor === 'Gautam-Ranpariya') {
                  reviewer = 'Karan_Unagar';
                } else {
                  reviewer = 'Gautam-Ranpariya';
                }

                // Assign reviewer
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: [reviewer]
                });

                console.log(`✅ Assigned reviewer: ${reviewer}`);
              } else {
                console.log('⚠️ Skipping assignment - PR is closed or draft');
              }
            } catch (error) {
              console.error('Error in assignment:', error);
              throw error;
            }
