name: Auto Assign Reviewer and Deploy

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewer (you)
        uses: kentaro-m/auto-assign-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          addAssignees: true
          addReviewers: true
          assignees: |
            Gautam-Ranpariya
          reviewers: |
            Gautam-Ranpariya

      - name: Add PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Assigned to @Gautam-Ranpariya for review!"
            })

  # Optional: Trigger Deploy Workflow after PR is approved
  trigger-deploy:
    runs-on: ubuntu-latest
    needs: assign-reviewer
    if: ${{ github.event.review.state == 'approved' }}

    steps:
      - name: Trigger Deploy Workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          workflow: 'deploy.yml'
          ref: ${{ github.ref }}
          inputs:
            deploy: true
