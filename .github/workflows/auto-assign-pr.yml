name: Auto Assign Reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      pr_author:
        description: 'Pull Request Author'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write
  actions: read

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Always assign Ka-ran123 as reviewer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
            const prAuthor = '${{ github.event.inputs.pr_author }}';

            console.log(`Processing PR #${prNumber} by ${prAuthor}`);

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['Ka-ran123']
              });

              console.log(`✅ Assigned reviewer: Ka-ran123`);
            } catch (error) {
              console.error('Error assigning reviewer:', error);
              throw error;
            }
