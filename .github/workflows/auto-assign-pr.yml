name: Auto Assign Reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      pr_author:
        description: 'Pull Request Author'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Get PR details and assign reviewer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
            const prAuthor = '${{ github.event.inputs.pr_author }}';
            
            // Get PR details
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Only proceed if PR is open and not draft
            if (pr.data.state === 'open' && !pr.data.draft) {
              // Assign reviewer and assignee
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['Gautam-Ranpariya']
              });

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                assignees: ['Gautam-Ranpariya']
              });

              console.log('✅ Successfully assigned reviewer and assignee');
            }

      - name: Auto-approve if PR author is repo owner
        if: github.event.inputs.pr_author == 'Gautam-Ranpariya'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
            
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: '✅ Auto-approved by repo owner'
            });

            console.log('✅ Auto-approved PR');

      - name: Comment for admin review if PR author is not owner
        if: github.event.inputs.pr_author != 'Gautam-Ranpariya'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ github.event.inputs.pr_number }}');
            
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Auto-assigned and requested review from @Gautam-Ranpariya after successful CI/CD checks"
            });

            console.log('✅ Added comment requesting review');