name: Deploy Workflow

on:
  workflow_run:
    workflows: ['CI Workflow', 'Auto Assign Reviewer'] # Trigger after CI and Auto-Assign complete
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # Only deploy if CI/CD workflow succeeded

    steps:
      - name: Record deployment start time
        run: echo "DEPLOY_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # Restore cached build artifacts
      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-node-modules-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Using pnpm"
            npm install -g pnpm
            pnpm install --frozen-lockfile
          elif [ -f "yarn.lock" ]; then
            echo "Using yarn"
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            echo "Using npm"
            npm ci
          else
            echo "No lock file found, using yarn install"
            yarn install
          fi

      - name: Deploy to Vercel
        run: |
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          echo "Deployment completed successfully!"

      - name: Calculate deployment time
        run: |
          DEPLOY_END_TIME=$(date +%s)
          DEPLOY_DURATION=$((DEPLOY_END_TIME - DEPLOY_START_TIME))
          echo "Deployment completed in ${DEPLOY_DURATION} seconds"

      - name: Display timing summary
        run: |
          echo "=== PIPELINE TIMING SUMMARY ==="
          echo "Build Duration: ${{ needs.build.outputs.build-duration }} seconds"
          echo "Test Duration: ${{ needs.test.outputs.test-duration }} seconds"
          echo "Deploy Duration: ${DEPLOY_DURATION} seconds"
          TOTAL_TIME=$((${{ needs.build.outputs.build-duration }} + ${{ needs.test.outputs.test-duration }} + DEPLOY_DURATION))
          echo "Total Pipeline Time: ${TOTAL_TIME} seconds"
          echo "==============================="

  # Optional: Notification job that runs after deployment
  notify:
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always() # Run even if previous jobs fail

    steps:
      - name: Send notification
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            # Add notification logic here (Slack, Discord, email, etc.)
          else
            echo "❌ Deployment failed or skipped"
            # Add failure notification logic here
          fi
