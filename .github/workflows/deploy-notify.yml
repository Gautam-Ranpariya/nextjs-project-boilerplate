name: Deploy

on:
  pull_request_review:
    types: [submitted]

env:
  NODE_VERSION: 20

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved' # Only deploy when PR is approved

    steps:
      - name: Record deployment start time
        run: echo "DEPLOY_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # Try to restore cached build artifacts from CI
      - name: Restore build artifacts
        id: cache-restore
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-build-${{ github.event.pull_request.head.sha }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Using pnpm"
            npm install -g pnpm
            pnpm install --frozen-lockfile
          elif [ -f "yarn.lock" ]; then
            echo "Using yarn"
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            echo "Using npm"
            npm ci
          else
            echo "No lock file found, using yarn install"
            yarn install
          fi

      - name: Build (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: yarn run build

      - name: Deploy to Vercel
        run: |
          npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          echo "Deployment completed successfully!"

      - name: Calculate deployment time
        run: |
          DEPLOY_END_TIME=$(date +%s)
          DEPLOY_DURATION=$((DEPLOY_END_TIME - DEPLOY_START_TIME))
          echo "Deployment completed in ${DEPLOY_DURATION} seconds"
          echo "DEPLOY_DURATION=${DEPLOY_DURATION}" >> $GITHUB_ENV

      - name: Comment deployment success
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployDuration = process.env.DEPLOY_DURATION;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deployment Successful!**\n\n✅ Deployed in ${deployDuration} seconds\n🔗 Your changes are now live!`
            });

  # Optional: Notification job that runs after deployment
  notify:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() # Run even if deployment fails

    steps:
      - name: Send notification
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            # Add notification logic here (Slack, Discord, email, etc.)
          else
            echo "❌ Deployment failed or skipped"
            # Add failure notification logic here
          fi

      - name: Comment on failure
        if: needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Deployment Failed!**\n\nPlease check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.`
            });
