name: CI/CD

on:
  push:
    branches: [main] # Trigger on PRs targeting 'main'
  pull_request:
    branches: [main] # Trigger on push to 'main' branch

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prettier check
        run: yarn run format:ci

      - name: ESLint check
        run: yarn run lint

      - name: Build Next.js
        run: yarn run build

      - name: Calculate build time
        run: |
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          echo "Build completed in ${BUILD_DURATION} seconds"
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV

      # Cache build artifacts for deployment
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-build-${{ github.sha }}

    outputs:
      build-duration: ${{ env.BUILD_DURATION }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Record test start time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn run test:ci

      - name: Calculate test time
        run: |
          TEST_END_TIME=$(date +%s)
          TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
          echo "Tests completed in ${TEST_DURATION} seconds"
          echo "TEST_DURATION=${TEST_DURATION}" >> $GITHUB_ENV

    outputs:
      test-duration: ${{ env.TEST_DURATION }}

    # Trigger auto-assign and deploy workflow after build and test pass
  trigger-autoassign:
    runs-on: ubuntu-latest
    needs: [build, test] # Ensure this runs after build and test jobs

    steps:
      - name: Trigger review and deploy workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref": "main"}' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto-assign.yml/dispatches
