name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:ci

      - name: ESLint check
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Calculate build time
        run: |
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          echo "Build completed in ${BUILD_DURATION} seconds"
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV

      # Cache build artifacts for deployment
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-build-${{ github.sha }}

    outputs:
      build-duration: ${{ env.BUILD_DURATION }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Record test start time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Calculate test time
        run: |
          TEST_END_TIME=$(date +%s)
          TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
          echo "Tests completed in ${TEST_DURATION} seconds"
          echo "TEST_DURATION=${TEST_DURATION}" >> $GITHUB_ENV

    outputs:
      test-duration: ${{ env.TEST_DURATION }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test] # Deploy only after both build and test succeed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on main branch push

    steps:
      - name: Record deployment start time
        run: echo "DEPLOY_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Restore cached build artifacts
      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        run: npm ci --prefer-offline

      # Example deployment steps - adjust based on your deployment target
      - name: Deploy to staging/production
        run: |
          echo "Deploying application..."
          # Add your deployment commands here, for example:
          # npm run deploy
          # or deploy to Vercel, Netlify, AWS, etc.
          echo "Deployment completed successfully!"

      - name: Calculate deployment time
        run: |
          DEPLOY_END_TIME=$(date +%s)
          DEPLOY_DURATION=$((DEPLOY_END_TIME - DEPLOY_START_TIME))
          echo "Deployment completed in ${DEPLOY_DURATION} seconds"

      - name: Display timing summary
        run: |
          echo "=== PIPELINE TIMING SUMMARY ==="
          echo "Build Duration: ${{ needs.build.outputs.build-duration }} seconds"
          echo "Test Duration: ${{ needs.test.outputs.test-duration }} seconds"
          echo "Deploy Duration: ${DEPLOY_DURATION} seconds"
          TOTAL_TIME=$((${{ needs.build.outputs.build-duration }} + ${{ needs.test.outputs.test-duration }} + DEPLOY_DURATION))
          echo "Total Pipeline Time: ${TOTAL_TIME} seconds"

    outputs:
      deployment-url: ${{ steps.vercel-deploy.outputs.preview-url }}

  # Optional: Notification job that runs after deployment
  notify:
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always() # Run even if previous jobs fail

    steps:
      - name: Send notification
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            # Add notification logic here (Slack, Discord, email, etc.)
          else
            echo "❌ Deployment failed or skipped"
            # Add failure notification logic here
          fi
