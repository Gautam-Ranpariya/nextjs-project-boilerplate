name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record build start time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prettier check
        run: yarn run format:ci

      - name: ESLint check
        run: yarn run lint

      - name: Build Next.js
        run: yarn run build

      - name: Calculate build time
        run: |
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          echo "Build completed in ${BUILD_DURATION} seconds"
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .next
            node_modules
          key: ${{ runner.os }}-build-${{ github.sha }}

    outputs:
      build-duration: ${{ env.BUILD_DURATION }}

  test:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Record test start time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn run test:ci

      - name: Calculate test time
        run: |
          TEST_END_TIME=$(date +%s)
          TEST_DURATION=$((TEST_END_TIME - TEST_START_TIME))
          echo "Tests completed in ${TEST_DURATION} seconds"
          echo "TEST_DURATION=${TEST_DURATION}" >> $GITHUB_ENV

    outputs:
      test-duration: ${{ env.TEST_DURATION }}

  trigger-autoassign:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger auto-assign workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "main",
              "inputs": {
                "pr_number": "${{ github.event.number }}",
                "pr_author": "${{ github.event.pull_request.user.login }}"
              }
            }' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto-assign.yml/dispatches"
        continue-on-error: true

      - name: Fallback - Direct assignment if dispatch fails
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ github.event.number }};
            const prAuthor = '${{ github.event.pull_request.user.login }}';

            // Assign reviewer and assignee directly
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['Gautam-Ranpariya']
              });

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                assignees: ['Gautam-Ranpariya']
              });

              // Auto-approve if PR author is repo owner
              if (prAuthor === 'Gautam-Ranpariya') {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  event: 'APPROVE',
                  body: '✅ Auto-approved by repo owner'
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: "👋 Auto-assigned and requested review from @Gautam-Ranpariya after successful CI/CD checks"
                });
              }

              console.log('✅ Successfully processed PR assignment');
            } catch (error) {
              console.error('Error in fallback assignment:', error);
            }
